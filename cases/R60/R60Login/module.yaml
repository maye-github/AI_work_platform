- Q-111（暗号方式）は「実装フェーズで確定」の模拟回答。工程3 時点でも具体方式が未定で、L-106/L-108/L-117 の単体試験前提は未固定。
- `kind: select` / `data_type: '-'` は basic-design の schema 列挙に無いが、既承認の R60Maker と同じ書き方。schema 改訂は未実施。
- 台帳 title と成果物 title の不一致（F-103/F-110）。plat に title 更新コマンドが無いため未修正。
- 清空重来の CR 記録なし（意図的な再構築）。現時点で未コミット。
- 工程3: inputs/outputs の API データ項（stfCd/errorCode/userInfo/mngInfo/pageList/kbnList）は I-ID 未定義のため文字列名で表現。schema 改訂が必要。
- 工程3: DSN の model 级 note は schema 外の運用注記。項目レベルの note は schema 内。
- 工程3: E-108（遷移先未選択）は派生ルール。素材に明記が無く、要顧客確認。
- 工程3: D-103 の供給元（マスタ／固定値）、D-104 の Session 有効期限、mngInfo の内容は未確定（ISS-101/ISS-102）。
