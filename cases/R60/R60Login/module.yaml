- TC 68 件 / IT 10 件の `result: pass` は `actual` / `evidence` に【模拟】を明記（実測ではない）。G3 は pass 時の証跡必須を検査する。
simulated_decisions:
- Q-111 暗号方式: 【模拟】AES-128-CBC、鍵=yyyymmdd の SHA-256 先頭 16 バイト、IV=固定（全ゼロ）、暗号文は Base64URL。
- E-108 遷移先未選択: 【模拟】業務エラーとして扱い、セッションエラー画面へ送る。
- F-108 上流 R 缺口: 【模拟】R-103 の解釈に含める（ログイン成功＝選択画面を開く）。上流変更は行わない。
- D-103 権限区分の供給元: 【模拟】固定値（Y=更新あり / N=更新なし）。マスタは使わない。
- D-104 Session 有効期限: 【模拟】30 分（アイドルタイムアウト）。mngInfo は「利用可能メニュー ID 一覧」。
- E-102 と E-104 の文面: 【模拟】別文面を許容（R-102 の「同じ扱い」はログイン可否のみ）。
- message_id: 【模拟】R60W=業務エラー / R60E=システムエラー / R60I=情報 の暫定規則。
- API データ項: 【模拟】I-ID を新設せず、L の inputs/outputs は文字列名で確定（schema 改訂待ち）。
- DSN model 级 note: 【模拟】schema 外の運用注記として残す。
- TC/IT の pass: 【模拟】証跡（実環境での実行なし）。
