doc: TECH_STACK
title: 技術スタック宣言（共通マスタログイン）
status: confirmed
approved_by: ["SE-001"]
approved_at: "2026-10-27"
version: '0.1'
owner: SE-001
created_at: '2026-10-27'
updated_at: '2026-10-27'
human_review_required: true
stack:
  note: 同一システム（生産系共通マスタ）内のモジュールのため、スタックは R60Maker と同一。
  backend: Python 3.12 / FastAPI / SQLAlchemy Core（text のみ）/ oracledb Thin
  frontend: TypeScript 5 / Vue 3 / Element Plus / Pinia / Vite
  database: Oracle 19c（本画面は参照のみ。DML なし）
  test: pytest / vitest
  conventions:
    timezone: Asia/Tokyo
    naming_definition_layer: snake_case
    naming_interface_layer: camelCase
  commands:
    build: npm run build
    test: python -m pytest tests/unit
    lint: ruff check
    run: uvicorn app.main:app --reload
decisions:
- topic: 社員コードの暗号化
  choice: AES-128-CBC、鍵=SHA-256(yyyymmdd) の先頭 16 バイト、IV=固定（全ゼロ）、暗号文=Base64URL
  why: 【模拟】Q-111 の模拟回答。他システムが同一 URL を組み立てるための互換仕様。
- topic: 稼働状態チェック
  choice: 3 端点のサーバ側前処理で実施
  why: クライアントからは判定できず、共通基盤の ONLINE_FLG を参照する。
- topic: Session
  choice: サーバ側 Session ストア。有効期限 30 分（アイドルタイムアウト）
  why: 【模拟】ISS-101 の標準規約が未提供のため暫定。
- topic: エラー区分
  choice: errorCode "0"=正常 / "1"=業務エラー / "9"=システムエラー
  why: 【模拟】Q-102 の模拟回答。
