scenarios:
- id: IT-101
  title: 初期表示
  goal: 利用者がログイン画面を開き、12 項目が初期値で表示される。
  steps:
  - 'no': 1
    do: 画面を開く。
    expect: タイトル「共通マスタ　ログイン」とシステム日時が表示される。
  - 'no': 2
    do: 画面候補・権限区分候補を確認する。
    expect: 画面は先頭候補、権限区分は「更新あり」が初期値。
  - 'no': 3
    do: ユーザーＩＤ・起動区分・URL を確認する。
    expect: ユーザーＩＤと URL は空白、起動区分は「3」。
  covers:
  - R-101
  - F-101
  - F-102
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-101
  - F-101
  - F-102
- id: IT-102
  title: ユーザーＩＤの入力チェック
  goal: 利用者が不正なユーザーＩＤでログインしようとすると、業務エラーになる。
  steps:
  - 'no': 1
    do: ユーザーＩＤを空のままログインする。
    expect: 業務エラー（R60W0101）でログインしない。
  - 'no': 2
    do: 6 桁・8 桁・全角・英字を入力してログインする。
    expect: 業務エラー（R60W0102）でログインしない。
  - 'no': 3
    do: 半角 7 桁を入力する。
    expect: 入力チェックを通過する。
  covers:
  - R-102
  - F-103
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-102
  - F-103
- id: IT-103
  title: ログイン成功
  goal: 利用者が正しい社員コードでログインし、選択した画面が開く。
  steps:
  - 'no': 1
    do: 有効な社員コード・画面・権限区分を選びログインする。
    expect: errorCode "0" で userInfo/mngInfo が返る。
  - 'no': 2
    do: 遷移先を確認する。
    expect: 選択した画面が開き、権限区分が引き継がれる。
  - 'no': 3
    do: 論理削除済み社員コードでログインする。
    expect: 業務エラー（R60W0104）でログインしない。
  covers:
  - R-103
  - F-104
  - F-105
  - F-106
  - F-108
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-103
  - F-104
  - F-105
  - F-106
  - F-108
- id: IT-104
  title: セッション情報保持
  goal: ログイン後、後続画面が会社・事業場・氏名を参照できる。
  steps:
  - 'no': 1
    do: ログイン成功後に後続画面を開く。
    expect: Session から会社・事業場・氏名を参照できる。
  covers:
  - R-104
  - F-107
  result: pass
  evidence: 【模拟】Session 確認（実環境では手動）
  related_ids:
  - R-104
  - F-107
- id: IT-105
  title: メニュー遷移
  goal: 利用者がメニューボタンからメニュー画面へ遷移し、起動区分が引き継がれる。
  steps:
  - 'no': 1
    do: 起動区分を「2」にしてメニューボタンを押す。
    expect: メニュー画面が開き、起動区分「2」が引き継がれる。
  covers:
  - R-105
  - F-109
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-105
  - F-109
- id: IT-106
  title: 遷移URLの出力
  goal: 利用者が URL 出力ボタンで、指定順の遷移 URL を得る。
  steps:
  - 'no': 1
    do: URL出力ボタンを押す。
    expect: stfCd・stfKbn・gmnId・kgnKbn の順の URL が URL 欄に表示される。
  - 'no': 2
    do: 権限区分を「更新なし」にして出力する。
    expect: kgnKbn=N になる。
  - 'no': 3
    do: 社員コード未入力で出力する。
    expect: stfCd が "NaN" を暗号化した値になる。
  covers:
  - R-106
  - F-110
  - F-114
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-106
  - F-110
  - F-114
- id: IT-107
  title: 稼働状態チェック
  goal: オンライン利用が許可されていないとき、3 端点すべてが業務エラーになる。
  steps:
  - 'no': 1
    do: ONLINE_FLG=0 の状態で /init を呼ぶ。
    expect: 業務エラー（R60W0105）が返る。
  - 'no': 2
    do: 同じ状態で /login を呼ぶ。
    expect: 業務エラー（R60W0105）が返る。
  - 'no': 3
    do: 同じ状態で /generateUrl を呼ぶ。
    expect: 業務エラー（R60W0105）が返る。
  covers:
  - R-107
  - F-111
  result: pass
  evidence: 【模拟】API 確認（実環境では自動化）
  related_ids:
  - R-107
  - F-111
- id: IT-108
  title: 画面終了
  goal: 利用者が閉じるボタンで確認メッセージを見て画面を閉じる。
  steps:
  - 'no': 1
    do: 閉じるボタンを押す。
    expect: 確認メッセージ（R60I0101）が表示される。
  - 'no': 2
    do: 「はい」を選ぶ。
    expect: 画面が閉じる。
  covers:
  - R-108
  - F-112
  result: pass
  evidence: 【模拟】画面確認（実環境では手動）
  related_ids:
  - R-108
  - F-112
- id: IT-109
  title: エラー区分とセッションエラー画面への遷移
  goal: 利用者が業務エラー時にセッションエラー画面へ、システムエラー時にシステムエラー処理へ遷移する。
  steps:
  - 'no': 1
    do: 存在しない社員コードでログインする。
    expect: 業務エラー（R60W0104）でセッションエラー画面へ遷移する。
  - 'no': 2
    do: 不正な暗号化社員コードでログインする。
    expect: 業務エラー（R60W0106）でセッションエラー画面へ遷移する。
  - 'no': 3
    do: 画面マスタ取得を失敗させる。
    expect: システムエラー（R60E0101）になる。
  covers:
  - R-109
  - F-113
  result: pass
  evidence: 【模拟】画面/API 確認（実環境では手動）
  related_ids:
  - R-109
  - F-113
- id: IT-110
  title: 社員コードの暗号化・復号
  goal: 当日鍵で暗号化した社員コードが復号でき、URL 形式と互換である。
  steps:
  - 'no': 1
    do: 当日に社員コードを暗号化し、/login で復号する。
    expect: 元の社員コードに一致する。
  - 'no': 2
    do: 前日の鍵で暗号化した値で /login を呼ぶ。
    expect: 復号に失敗し業務エラー（R60W0106）になる。
  - 'no': 3
    do: 生成 URL を他システム形式と比較する。
    expect: stfCd・stfKbn・gmnId・kgnKbn の順で互換。
  covers:
  - R-110
  - F-104
  - F-106
  - F-114
  result: pass
  evidence: 【模拟】API 確認（実環境では自動化）
  related_ids:
  - R-110
  - F-104
  - F-106
  - F-114
- id: IT-111
  title: 非機能観測点
  goal: 性能・同時利用・セッション失効の観測点を確認する（実行は人判断）。
  steps:
  - 'no': 1
    do: 同時 100 利用を想定した負荷をかける。
    expect: 応答 3 秒以内（Q-108 の模拟値）。
  - 'no': 2
    do: 30 分アイドル後に操作する。
    expect: Session が失効し、再ログインを要求する。
  covers:
  - R-101
  - R-107
  result: not_run
  evidence: 【模拟】観測点のみ。実行は非機能環境で人判断。
  related_ids:
