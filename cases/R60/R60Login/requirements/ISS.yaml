- id: ISS-101
  text: 標準規約（画面遷移方式・エラーコード体系・メッセージ形式）が未提供。
  block: true
  blocks_stage: 2
  owner: SE-001
  resolution: 弊社提案で暫定採用（顧客確認中）。回答が来たら差分のみ差し替える。
  related_ids:
  - ISS-101
  proposal:
  - '画面遷移方式（暫定）: ログイン成功時は選択画面を新しいウィンドウ／タブで開く。開けない環境では同一ウィンドウで開く。'
  - 'エラーコード体系（暫定3値）: "0"=正常 / "1"=業務エラー / "9"=システムエラー。業務エラー時はセッションエラー画面へ遷移する。'
  - 'メッセージ形式（暫定）: 応答は errorCode を必ず返し、業務エラーでは messageId を併せて返す。文面はサーバ側で解決する。'
  rationale: 標準規約の提供を待つと工程2 が止まるため、上記を弊社案として置き、顧客回答後に差分だけ差し替える。
  customer_confirmed: false
