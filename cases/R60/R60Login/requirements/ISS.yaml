  - '画面マスタ（参照のみ・暫定）: 画面ID / 画面名（末尾にシミュレーション区分が付く場合がある） / 有効フラグ / 表示順。'
  - '稼働状態（参照のみ・暫定）: 共通基盤が保持する単一フラグを参照する。'
  rationale: マスタ定義の提供を待つと工程3 が止まるため、物理名は弊社案とし、提供後に D-ID の定義だけ差し替える。
