assumptions:
- id: ASM-101
  text: 社員マスタは論理削除フラグで管理されており、削除済みは業務上「存在しない」と同義である。
  basis: 素材 §3.4 が「論理削除されていないこと」を条件に挙げている。
  if_wrong: 削除済み社員がログインできてしまう、または正当な社員が締め出される。
  related_ids:
  - R-103
- id: ASM-102
  text: 画面マスタは有効フラグと表示順を持ち、本画面は有効なものだけを表示順に取得する。
  basis: 素材 §4.2 が「有効なもののみ」「表示順はマスタの保守による」としている。
  if_wrong: 候補の欠落・順序不同で初期表示の受入条件が満たせない。
  related_ids:
  - R-101
- id: ASM-103
  text: 社員コードの暗号化は、サーバとクライアントで同一の方式・同一の当日鍵を実装できる。
  basis: 素材 §4.3 が暗号化済みを画面から送るとし、§4.5 が当日鍵を要求している。
  if_wrong: /login の復号が成立せずログインできない。
  related_ids:
  - R-110
- id: ASM-104
  text: 稼働状態は共通基盤が保持し、本画面のサーバから参照できる。
  basis: 素材 §3.7 が稼働状態チェックを要求しているが保持場所を定めていない。
  if_wrong: 稼働不可の判定ができず、R-107 が実装できない。
  related_ids:
  - R-107
- id: ASM-105
  text: 遷移 URL の host/port は環境設定として外部から与えられる（コードに埋め込まない）。
  basis: 素材 §3.6 が環境ごとに異なるとしている。
  if_wrong: 環境間で URL が壊れる、または機密値がコードに混入する。
  related_ids:
  - R-106
- id: ASM-106
  text: 画面マスタの候補には同一画面のシミュレーション版（名称末尾に区分が付くもの）も含まれ、本画面は加工せずそのまま表示する。
  basis: 素材 §3.2 が「候補には同一画面のシミュレーション版が含まれる」としている。
  if_wrong: 候補の表示内容・件数が変わり、初期表示の受入条件が変わる。
  related_ids:
  - R-101
- id: ASM-107
  text: 暗号化された社員コードは URL のクエリパラメータとして URL エンコードして埋め込む。
  basis: 素材 §3.6 の URL 形式はクエリパラメータで受け渡すが、暗号文の文字種・エンコード方法は明記されていない。
  if_wrong: 暗号文に予約文字が含まれる場合に URL が壊れ、他システムからの遷移が失敗する。
  related_ids:
  - R-106
  - R-110
- id: ASM-108
  text: 「利用権限保持者のみ」は利用対象者の前提であり、本画面のログイン可否では権限の有無を判定しない（判定は社員コードの存在と論理削除のみ）。
  basis: 素材 §3.1 が利用対象者を限定する一方、§3.4 がログイン可否に用いるのは社員コードの存在だけとしている。
  if_wrong: 権限なしの利用者がログインできる、または権限判定を本画面に実装して仕様外の挙動になる。
  related_ids:
  - R-103
