- id: L-117
  title: 遷移URL組立
  belongs_to: F-114
  inputs:
  - stfCd
  - stfKbn
  - gmnId
  - kgnKbn
  outputs:
  - url
  steps:
  - 'no': 1
    do: 社員コードを決定する。
    cond: stfCd が空でない
    else: '"NaN" を社員コードとして扱う'
  - 'no': 2
    do: 社員コードを当日鍵で暗号化する。
  - 'no': 3
    do: stfKbn を検証する。
    cond: 1／2／3 のいずれか
    else: E-103 を返す
  - 'no': 4
    do: host／port を環境設定から取得する。
    cond: 取得成功
    else: E-111 を返す
  - 'no': 5
    do: stfCd・stfKbn・gmnId・kgnKbn の順で URL を組み立てる。
  - 'no': 6
    do: 暗号化値を URL エンコードする（ASM-107）。
  boundaries:
  - item: stfCd
    value: 未入力
    expect: '"NaN" を暗号化して URL に載せる'
  - item: stfKbn
    value: '"1"'
    expect: URL 組立可
  - item: stfKbn
    value: '"0"'
    expect: E-103
  - item: stfKbn
    value: '"4"'
    expect: E-103
  errors:
  - E-103
  - E-111
