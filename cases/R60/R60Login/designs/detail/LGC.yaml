- id: L-113
  title: URL出力要求と表示
  belongs_to: F-110
  inputs:
  - I-103
  - I-104
  - I-106
  - I-107
  outputs:
  - I-110
  steps:
  - 'no': 1
    do: 起動区分を検証する（L-105）。
    cond: 1／2／3 のいずれか
    else: E-103 を返し L-116 へ渡す
  - 'no': 2
    do: params {stfCd(平文), stfKbn, gmnId, kgnKbn} を送る。
  - 'no': 3
    do: 応答を処理する。
    cond: errorCode が "0"
    else: 次のステップへ進む
  - 'no': 4
    do: messageId に応じた業務エラー（E-103/E-105）を返し L-116 へ渡す。
    cond: errorCode が "1"
    else: E-111 を返し L-116 へ渡す
  - 'no': 5
    do: I-110 に url を表示する。
    cond: url が 150 文字以内
    else: E-109 を返し L-116 へ渡す
  boundaries:
  - item: url
    value: 150 文字
    expect: 表示可
  - item: url
    value: 151 文字
