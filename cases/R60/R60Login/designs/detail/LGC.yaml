  steps:
  - 'no': 1
    do: メニュー画面へ遷移する。
  - 'no': 2
    do: stfKbn（起動区分）を引き継ぐ。
  - 'no': 3
    do: 遷移方式は Q-101 に従う。
  boundaries:
