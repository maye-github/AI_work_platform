logic:
- id: L-101
  title: 初期表示API呼び出し
  belongs_to: F-101
  inputs: []
  outputs:
  - I-106
  - I-107
  steps:
  - 'no': 1
    do: 初期表示 API に空の params を送る。
  - 'no': 2
    do: 応答 errorCode を検証する。
    cond: errorCode が "0"
    else: 次のステップへ進む
  - 'no': 3
    do: messageId に応じた業務エラー（E-105/E-107）を返し L-116 へ渡す。
    cond: errorCode が "1"
    else: E-111 を返し L-116 へ渡す
  - 'no': 4
    do: pageList と kbnList を保持する。
  boundaries:
  - item: pageList
    value: 0 件
    expect: 画面は表示し、画面候補は未選択
  - item: pageList
    value: 1 件以上
    expect: 先頭を初期選択
  errors:
  - E-105
  - E-107
  - E-111
  note: 稼働状態チェックはサーバ側の前処理（L-114）で行い、不可時は E-105 が返る。
  related_ids:
  - F-101
  - D-102
  - D-103
  - E-105
  - E-107
  - E-111
  - L-116
  - Q-104
- id: L-102
  title: 画面候補・権限区分候補の整形
  belongs_to: F-101
  inputs:
  - I-106
  - I-107
  outputs:
  - I-106
  - I-107
  steps:
  - 'no': 1
    do: pageList のうち有効フラグ=1 のものを残す。
  - 'no': 2
    do: 表示順の昇順に並べる。
  - 'no': 3
    do: 同一画面のシミュレーション版も除外せず保持する（ASM-106）。
  - 'no': 4
    do: kbnList を Y=更新あり / N=更新なし の順に整える。
  boundaries:
  - item: pageList
    value: 0 件
    expect: 空リストのまま画面表示
  - item: pageList
    value: 1 件
    expect: その 1 件が初期値
  errors: []
  related_ids:
  - F-101
  - D-102
  - D-103
  - ASM-102
  - ASM-106
  - Q-104
- id: L-103
  title: 画面初期値設定
  belongs_to: F-102
  inputs:
  - I-106
  - I-107
  outputs:
  - I-101
  - I-102
  - I-103
  - I-104
  - I-105
  - I-106
  - I-107
  - I-108
  - I-109
  - I-110
  - I-111
  - I-112
  steps:
  - 'no': 1
    do: I-101 に固定タイトル「共通マスタ　ログイン」を設定する。
  - 'no': 2
    do: I-102 にサーバ日時を YYYY/MM/DD hh:mm:ss で設定する。
  - 'no': 3
    do: I-103 を空白、I-104 を "3"、I-110 を空白に設定する。
  - 'no': 4
    do: I-105 に固定説明文「1：本店ユーザー、2：工場ユーザー、3：システム管理者」を設定する。
  - 'no': 5
    do: I-106 に pageList 先頭、I-107 に "Y" を設定する。
  - 'no': 6
    do: I-108・I-109・I-111・I-112 を活性に設定する。
  boundaries:
  - item: I-106
    value: pageList 0 件
    expect: 未選択
  errors: []
  related_ids:
  - F-102
  - I-101
  - I-102
  - I-103
  - I-104
  - I-105
  - I-106
  - I-107
  - I-108
  - I-109
  - I-110
  - I-111
  - I-112
  - Q-108
  - ASM-106
- id: L-104
  title: ユーザーＩＤチェック
  belongs_to: F-103
  inputs:
  - I-103
  outputs: []
  steps:
  - 'no': 1
    do: I-103 の必須チェックを行う。
    cond: 空でない
    else: E-101 を返し L-116 へ渡す
  - 'no': 2
    do: I-103 の半角 7 桁チェックを行う。
    cond: 半角数字 7 桁である
    else: E-102 を返し L-116 へ渡す
  - 'no': 3
    do: 妥当として次工程へ渡す。
  boundaries:
  - item: I-103
    value: 6 桁
    expect: E-102
  - item: I-103
    value: 7 桁
    expect: 妥当
  - item: I-103
    value: 8 桁
    expect: E-102
  - item: I-103
    value: 全角数字
    expect: E-102
  - item: I-103
    value: 英字を含む
    expect: E-102
  errors:
  - E-101
  - E-102
  related_ids:
  - F-103
  - I-103
  - R-102
  - L-116
  - E-101
  - E-102
- id: L-105
  title: 起動区分チェック
  belongs_to: F-103
  inputs:
  - I-104
  outputs: []
  steps:
  - 'no': 1
    do: I-104 が 1／2／3 のいずれかであることを検証する。
    cond: いずれかである
    else: E-103 を返し L-116 へ渡す
  boundaries:
  - item: I-104
    value: '"1"'
    expect: 妥当
  - item: I-104
    value: '"2"'
    expect: 妥当
  - item: I-104
    value: '"3"'
    expect: 妥当
  - item: I-104
    value: '"0"'
    expect: E-103
  - item: I-104
    value: '"4"'
    expect: E-103
  - item: I-104
    value: 空
    expect: E-103
  - item: I-104
    value: 英字
    expect: E-103
  errors:
  - E-103
  related_ids:
  - F-103
  - I-104
  - Q-110
  - L-116
  - E-103
- id: L-106
  title: 社員コード暗号化
  belongs_to: F-104
  inputs:
  - I-103
  outputs:
  - 暗号化済み社員コード
  steps:
  - 'no': 1
    do: 当日日付 yyyymmdd を鍵の材料にする。
  - 'no': 2
    do: 社員コードを暗号化する（Q-111 の模拟方式）。
  - 'no': 3
    do: 暗号化済み社員コードを L-107 へ引き渡す。
  boundaries:
  - item: 社員コード
    value: 半角 7 桁
    expect: 暗号化成功
  - item: 日付
    value: 当日
    expect: 当日内の復号で一致
  errors: []
  note: 【模拟】AES-128-CBC、鍵=yyyymmdd の SHA-256 先頭 16 バイト、IV=固定（全ゼロ）、暗号文は Base64URL。
  related_ids:
  - F-104
  - I-103
  - R-110
  - ASM-103
  - Q-111
- id: L-107
  title: ログインAPI呼び出しと応答分岐
  belongs_to: F-105
  inputs:
  - I-103
  - I-104
  - I-106
  - I-107
  - 暗号化済み社員コード
  outputs: []
  steps:
  - 'no': 1
    do: gmnId が選択されていることを確認する。
    cond: 選択済み
    else: E-108 を返し L-116 へ渡す
  - 'no': 2
    do: params {stfCd(暗号化済み), stfKbn, gmnId, kgnKbn} を送る。
  - 'no': 3
    do: userInfo・mngInfo を保持して F-107 へ渡す。
    cond: errorCode が "0"
    else: 次のステップへ進む
  - 'no': 4
    do: messageId に応じて E-104/E-105/E-106 を返し L-116 へ渡す。
    cond: errorCode が "1"
    else: 次のステップへ進む
  - 'no': 5
    do: E-111 を返し L-116 へ渡す。
    cond: errorCode が "9"
    else: E-111 を返し L-116 へ渡す
  boundaries:
  - item: errorCode
    value: '"0"'
    expect: 成功
  - item: errorCode
    value: '"1"'
    expect: 業務エラー（E-104）
  - item: errorCode
    value: '"9"'
    expect: システムエラー（E-111）
  errors:
  - E-104
  - E-105
  - E-108
  - E-111
  note: 稼働状態チェックはサーバ側の前処理（L-114）で行い、不可時は E-105 が返る。
  related_ids:
  - F-105
  - I-103
  - I-104
  - I-106
  - I-107
  - R-103
  - E-104
  - E-105
  - E-108
  - E-111
