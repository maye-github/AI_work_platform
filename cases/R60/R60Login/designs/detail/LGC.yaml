  - L-116
  - Q-109
- id: L-108
  title: 社員コード復号
  belongs_to: F-106
  inputs:
  - stfCd
  outputs:
  - 復号済み社員コード
  steps:
  - 'no': 1
    do: stfCd を当日鍵で復号する。
    cond: 復号成功
    else: E-106 を返し L-116 へ渡す
  - 'no': 2
    do: 復号結果を存在確認へ渡す。
  boundaries:
  - item: stfCd
    value: 当日鍵で暗号化した値
    expect: 復号成功
  - item: stfCd
    value: 前日鍵で暗号化した値
    expect: E-106
  errors:
  - E-106
  note: 【模拟】復号方式は Q-111 の模拟方式に従う。
  related_ids:
  - F-106
  - R-110
  - L-116
  - E-106
  - Q-111
- id: L-109
  title: 社員存在確認
  belongs_to: F-106
  inputs:
  - 復号済み社員コード
  outputs:
  - userInfo
  - mngInfo
  steps:
  - 'no': 1
    do: 社員マスタを STF_CD で検索する。
  - 'no': 2
    do: 存在し、かつ論理削除されていないことを確認する。
    cond: 存在し DEL_FLG が "0"
    else: E-104 を返し L-116 へ渡す
  - 'no': 3
    do: CMP_CD・JGY_CD・STF_NM を取得する。
  - 'no': 4
    do: 所属・権限・有効期限は判定しない（ASM-108）。
  boundaries:
  - item: DEL_FLG
    value: '"0"'
    expect: ログイン可
  - item: DEL_FLG
    value: '"1"'
    expect: E-104
  errors:
  - E-104
  related_ids:
  - F-106
  - D-101
  - R-103
  - ASM-101
  - ASM-108
  - L-116
  - E-104
- id: L-110
  title: セッション保存
  belongs_to: F-107
  inputs:
  - userInfo
  - mngInfo
  outputs: []
  steps:
  - 'no': 1
    do: STF_CD・CMP_CD・JGY_CD・STF_NM を Session に保存する。
    cond: 保存成功
    else: E-111 を返し L-116 へ渡す
  - 'no': 2
    do: 後続の業務画面から参照可能にする。
  boundaries:
  - item: Session
    value: 保存成功
    expect: 保存される
  - item: Session
    value: 保存失敗
    expect: E-111
  errors:
  - E-111
  note: mngInfo の内容は素材に定義が無い（Q-106 / ISS-102）。保存項目は userInfo の範囲に限定する。
  related_ids:
  - F-107
  - D-104
  - R-104
  - Q-106
  - L-116
  - ISS-102
- id: L-111
  title: ログイン成功時の遷移先決定
  belongs_to: F-108
