  - name: STF_NM
    logical: 氏名
    type: string
    length: 40
    required: false
    note: 後続画面から参照
  note: Session ストア（物理表ではない）。【模拟】有効期限は 30 分（アイドルタイムアウト）。mngInfo は「利用可能メニュー ID 一覧」として扱う。排他制御は不要（利用者ごとに独立）。物理名・桁は暫定。
