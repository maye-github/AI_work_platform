  notes: 共通マスタログイン（R60Login）を新規構築。画面 12 項目、3 端点（init / login / generateUrl）、暗号化・復号、エラー区分、稼働状態チェックを実装。R-101〜R-110 の 10 要件が対象。
  procedure:
  - 'no': 1
    do: ビルド成果物の配置
    check: 起動ログにエラーが無い
  - 'no': 2
    do: 環境設定の投入（host/port・Session TTL・ONLINE_FLG）
    check: 実値がリポジトリに無い
  - 'no': 3
    do: 'スモーク: /R60Login/init・/login・/generateUrl'
    check: errorCode が返る
  - 'no': 4
    do: 画面 1 周（初期表示→ログイン→画面遷移→URL出力→閉じる）
    check: 受入条件どおり
  rollback:
  - 'no': 1
    do: 直前のビルド成果物へ切り戻す
  - 'no': 2
    do: 環境設定を戻す
  - 'no': 3
    do: スモーク再実施
  rollback_target_minutes: 15
  drilled: false
