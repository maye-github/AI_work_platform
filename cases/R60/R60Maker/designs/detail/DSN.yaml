models:
- id: D-201
  title: メーカーマスタ
  table_name: R60_MAKER_M_TBL
  entity: メーカー
  key:
  - MAKER_CD
  columns:
  - name: MAKER_CD
    logical: メーカーコード
    type: string
    length: 5
    required: true
    note: 主キー。半角英数字5桁
  - name: MAKER_NM
    logical: メーカー日本語名
    type: string
    length: 30
    required: true
    note: 30Byte。禁止文字あり
  - name: MAKER_ANM
    logical: メーカーカナ名
    type: string
    length: 15
    required: false
    note: 半角カナ15桁
  - name: SEND_KBN
    logical: 送信区分
    type: code
    length: 1
    required: true
    note: INSERT 時 '0' 固定
  - name: SEND_STS
    logical: 送信ステータス
    type: code
    length: 1
    required: true
    note: 削除時：更新前 '9' なら維持、以外は '0'
  - name: DEL_FLG
    logical: 削除フラグ
    type: code
    length: 1
    required: true
    note: '''1'' が削除。検索の既定は ''0'' のみ'
  - name: REG_STS
    logical: 登録ステータス
    type: code
    length: 1
    required: true
    note: 判定基準は共通仕様（Q-205・暫定案あり）
  - name: ASD_STU_FLG
    logical: ASD設定フラグ
    type: code
    length: 1
    required: true
    note: INSERT 時 '0' 固定
  - name: REV_NO
    logical: 改訂番号
    type: number
    length: 8
    required: true
    note: 更新・削除で +1
  - name: KSN_DAT
    logical: 更新日時
    type: date
    length: null
    required: true
    note: 排他の比較対象（Q-206）
  related_ids:
