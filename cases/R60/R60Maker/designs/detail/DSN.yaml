  - name: CDV_VAL
    logical: 値
    type: string
    length: 10
    required: true
    note: 候補の値
  - name: CDV_NM
    logical: 名称
    type: string
    length: 40
    required: true
    note: 画面に出す名称
  - name: DSP_ORD
    logical: 表示順
    type: number
    length: 3
    required: true
    note: 候補の並び
