- id: L-207
  title: 削除（論理削除）
  belongs_to: F-209
  inputs:
  - I-227
  outputs:
  - 削除結果
  steps:
  - 'no': 1
    do: 緊急配信の状態に応じて名称必須を判定
    cond: null
    else: null
  - 'no': 2
    do: 削除確認
    cond: null
    else: null
  - 'no': 3
    do: 被参照を確認
    cond: 参照あり
    else: E-206
  - 'no': 4
    do: 排他を確認
    cond: 不一致
    else: E-207
  - 'no': 5
    do: DEL_FLG='1'、REG_STS 再判定、REV_NO+1 で UPDATE
    cond: null
    else: null
  boundaries: []
  errors:
