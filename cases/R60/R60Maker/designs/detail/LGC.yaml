  title: 被参照チェック
  belongs_to: F-209
  inputs:
  - MAKER_CD
  outputs:
  - 参照の有無
  steps:
  - 'no': 1
    do: 区分'1' の被参照を数える
    cond: '>0'
    else: 参照あり
  - 'no': 2
    do: 区分'2' の被参照を数える
    cond: '>0'
    else: 参照あり
